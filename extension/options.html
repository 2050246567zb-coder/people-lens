<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物速览 · 设置</title><link rel="stylesheet" href="options.css"></head>
<body><main class="settings-page"><header class="page-header"><div class="logo" aria-hidden="true">人</div><div><h1>人物速览</h1><p>连接模型，选择分析范围。</p></div><span class="version">0.1.8</span></header>
<form id="settings-form"><section class="panel" id="connection"><h2>模型连接</h2><div class="fields"><label class="full">API 地址<input id="endpoint" type="url" required placeholder="https://api.deepseek.com/v1" autocomplete="off" spellcheck="false"><small>使用 OpenAI 兼容接口。</small></label><label>API Key<div class="key-field"><input id="apiKey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false"><button id="reveal-key" type="button" aria-label="显示 API Key">显示</button></div></label><label>模型名称<input id="model" required placeholder="deepseek-chat" autocomplete="off" spellcheck="false"></label></div></section>
<section class="panel" id="analysis"><h2>分析范围</h2><div class="mode-grid" role="radiogroup" aria-label="分析方式"><label class="mode"><input type="radio" name="mode" value="recent" checked><span><strong>最近 X 条</strong><small>速度优先</small></span></label><label class="mode"><input type="radio" name="mode" value="earliest"><span><strong>最早 X 条</strong><small>从早期内容看起</small></span></label><label class="mode"><input type="radio" name="mode" value="mixed"><span><strong>混合 X 条</strong><small>兼顾早期与近期</small></span></label></div><div class="quantity-row"><label for="count">分析条数</label><input id="count" type="number" min="1" max="50" value="10" required><span>条</span></div><p id="mode-hint" class="hint">最近 10 条，按发布时间抽样。</p></section>
<details id="advanced-settings" class="advanced"><summary>高级设置</summary><div class="advanced-body"><h2>分析偏好</h2><div class="content-choice" role="radiogroup" aria-label="内容类型"><label><input type="radio" name="contentMode" value="text" checked><span>文字分析 <small>更快</small></span></label><label><input type="radio" name="contentMode" value="vision"><span>图文分析 <small>需要视觉模型</small></span></label></div><div class="fields"><label>介绍长度<select id="summaryLength"><option value="100">约 100 字</option><option value="180">约 180 字</option><option value="300">约 300 字</option><option value="500">约 500 字</option></select></label><label>最多分析图片数<input id="imageLimit" type="number" min="1" max="6" value="3"></label><label class="full">自定义分析偏好<textarea id="prompt" rows="3" maxlength="5000" placeholder="例如：重点关注长期兴趣和分享过的项目。"></textarea></label></div>
<div class="fields timing-fields"><label>生成方式<select id="generationMode"><option value="fast">速度优先</option><option value="default">保持模型默认</option></select><small>速度优先会关闭 DeepSeek 官方接口的思考模式，其他接口保持兼容。</small></label><label>模型输出上限（token）<input id="maxOutputTokens" type="number" min="256" max="32768" value="4096"><small>介绍长度仍由字数设置决定；上限不会强制写满。</small></label></div>
<div id="mix-fields" class="mix-fields" hidden><h3>混合分配权重</h3><div class="mix-inputs"><label>最早<input id="mix-old" type="number" min="0" max="100" value="1"></label><label>中间<input id="mix-mid" type="number" min="0" max="100" value="1"></label><label>最近<input id="mix-new" type="number" min="0" max="100" value="1"></label></div><small>默认平均分配，总条数仍为 X。</small></div>
<div class="fields timing-fields"><label>后台采集并发<select id="localConcurrency"><option value="1">1 个页面</option><option value="2">2 个页面</option><option value="3" selected>3 个页面 · 默认</option><option value="4">4 个页面</option><option value="5">5 个页面</option></select><small>仅在缺少正文时打开后台页，完成或取消后自动关闭。</small></label></div>
<div class="fields timing-fields"><label>取数等待上限<select id="budgetSeconds"><option value="5">5 秒</option><option value="10">10 秒</option><option value="15">15 秒 · 默认</option><option value="30">30 秒</option><option value="45">45 秒</option></select></label><label>结果缓存时长<select id="cacheHours"><option value="1">1 小时</option><option value="6">6 小时 · 默认</option><option value="12">12 小时</option><option value="24">24 小时</option><option value="72">3 天</option></select></label></div><p class="hint">等待上限不含模型生成时间。未取得完整列表时，卡片会说明实际分析范围。</p>
<div class="advanced-group"><h2>使用选项</h2><label class="switch-row"><span>启用人物速览</span><input id="enabled" type="checkbox" checked role="switch"></label><label class="switch-row"><span>点击回复后自动分析</span><input id="autoAnalyze" type="checkbox" checked role="switch"></label></div>
<div class="advanced-group"><h2>连接与数据</h2><div class="utility-buttons"><button type="button" id="test-api" class="secondary">测试连接</button><button type="button" id="clear-cache" class="secondary">清除分析缓存</button></div><p class="hint">连接测试会调用一次模型。Key 与缓存保存在本机；分析资料仅发送给你配置的 API。本版不读取私聊。</p></div></div></details>
<footer><div id="status" role="status" aria-live="polite">设置保存在当前浏览器。</div><button id="save" type="submit" class="primary">保存设置</button></footer></form></main><script type="module" src="options.js"></script></body></html>
